<style>
    /* Scoped styles - only affects sponsor slideshow */
    .sponsor-slideshow {
        position: relative;
        max-width: 1200px;
        width: 95%;
        height: 400px;
        margin: 30px auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    
    .sponsor-slideshow .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: translateX(100px) scale(0.95);
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: linear-gradient(45deg, #f8f9fa, #ffffff);
        pointer-events: none;
    }
    
    .sponsor-slideshow .slide.active {
        opacity: 1;
        transform: translateX(0) scale(1);
        pointer-events: auto;
    }
    
    .sponsor-slideshow .slide.prev {
        transform: translateX(-100px) scale(0.95);
    }
    
    .sponsor-slideshow .slide a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
        text-decoration: none;
    }
    
    .sponsor-slideshow .slide img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        transition: transform 0.3s ease;
        display: block;
    }
    
    .sponsor-slideshow .slide a:hover img {
        transform: scale(1.02);
    }
    
    .sponsor-slideshow .slide-indicator {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
    }
    
    .sponsor-slideshow .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }
    
    .sponsor-slideshow .dot.active {
        background: white;
        transform: scale(1.3);
        border-color: #667eea;
    }
    
    .sponsor-slideshow .dot:hover {
        background: rgba(255,255,255,0.8);
    }
    
    .sponsor-slideshow .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.95);
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 24px;
        font-weight: bold;
        color: #333;
        transition: all 0.3s ease;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .sponsor-slideshow .nav-btn:hover {
        background: white;
        transform: translateY(-50%) scale(1.1);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    
    .sponsor-slideshow .nav-btn:active {
        transform: translateY(-50%) scale(0.95);
    }
    
    .sponsor-slideshow .prev-btn {
        left: 20px;
    }
    
    .sponsor-slideshow .next-btn {
        right: 20px;
    }
    
    .sponsor-slideshow .slide-title {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: white;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.5s ease;
        z-index: 5;
        pointer-events: none;
    }
    
    .sponsor-slideshow .slide.active .slide-title {
        opacity: 1;
    }
    
    .sponsor-slideshow .progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        transition: width 4s linear;
        z-index: 5;
    }
    
    @keyframes sponsorSlideIn {
        0% {
            opacity: 0;
            transform: translateX(50px) scale(0.9);
        }
        100% {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
    }
    
    .sponsor-slideshow .slide.active {
        animation: sponsorSlideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    @media (max-width: 768px) {
        .sponsor-slideshow {
            height: 300px;
            margin: 15px auto;
            width: 98%;
        }
        
        .sponsor-slideshow .slide {
            padding: 15px;
        }
        
        .sponsor-slideshow .nav-btn {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }
        
        .sponsor-slideshow .prev-btn {
            left: 10px;
        }
        
        .sponsor-slideshow .next-btn {
            right: 10px;
        }
        
        .sponsor-slideshow .slide-title {
            font-size: 12px;
            padding: 5px 12px;
        }
    }
</style>

<script>
(function() {
    // Scope everything to avoid conflicts
    const container = document.querySelector('.sponsor-slideshow');
    if (!container) return;
    
    let currentSlideIndex = 0;
    const slides = container.querySelectorAll('.slide');
    const progressBar = container.querySelector('.progress-bar');
    const indicatorContainer = container.querySelector('.slide-indicator');
    const totalSlides = slides.length;
    let autoSlideInterval = null;
    let dots = [];
    
    // Auto-generate dots based on number of slides
    function generateDots() {
        if (!indicatorContainer) return;
        indicatorContainer.innerHTML = '';
        dots = [];
        
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('span');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
            dot.onclick = function() {
                sponsorCurrentSlide(i + 1);
            };
            indicatorContainer.appendChild(dot);
            dots.push(dot);
        }
    }
    
    function showSlide(index) {
        // Remove active class from all slides
        slides.forEach((slide, i) => {
            slide.classList.remove('active', 'prev');
            if (i < index) {
                slide.classList.add('prev');
            }
        });
        
        // Remove active class from all dots
        dots.forEach(function(dot) { 
            dot.classList.remove('active'); 
        });
        
        // Add active class to current slide and dot
        if (slides[index] && dots[index]) {
            slides[index].classList.add('active');
            dots[index].classList.add('active');
        }
        
        // Update progress bar
        if (progressBar) {
            progressBar.style.width = '0%';
            setTimeout(function() {
                progressBar.style.width = '100%';
            }, 100);
        }
        
        currentSlideIndex = index;
    }
    
    function nextSlide() {
        const nextIndex = (currentSlideIndex + 1) % totalSlides;
        showSlide(nextIndex);
    }
    
    window.sponsorChangeSlide = function(direction) {
        const nextIndex = currentSlideIndex + direction;
        if (nextIndex >= 0 && nextIndex < totalSlides) {
            showSlide(nextIndex);
        } else if (nextIndex < 0) {
            showSlide(totalSlides - 1);
        } else {
            showSlide(0);
        }
        resetAutoSlide();
    };
    
    window.sponsorCurrentSlide = function(index) {
        const slideIndex = index - 1;
        if (slideIndex >= 0 && slideIndex < totalSlides) {
            showSlide(slideIndex);
            resetAutoSlide();
        }
    };
    
    function startAutoSlide() {
        if (autoSlideInterval) {
            clearInterval(autoSlideInterval);
        }
        autoSlideInterval = setInterval(nextSlide, 4000);
    }
    
    function resetAutoSlide() {
        clearInterval(autoSlideInterval);
        startAutoSlide();
    }
    
    // Initialize
    if (slides.length > 0) {
        generateDots();
        showSlide(0);
        startAutoSlide();
    }
    
    // Pause auto-slide on hover
    container.addEventListener('mouseenter', function() {
        if (autoSlideInterval) {
            clearInterval(autoSlideInterval);
            autoSlideInterval = null;
        }
    });
    
    container.addEventListener('mouseleave', function() {
        startAutoSlide();
    });
    
    // Keyboard navigation (only when slideshow is focused)
    container.setAttribute('tabindex', '0');
    container.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') {
            window.sponsorChangeSlide(-1);
        } else if (e.key === 'ArrowRight') {
            window.sponsorChangeSlide(1);
        }
    });
    
    // Handle image loading errors
    container.querySelectorAll('.slide img').forEach(img => {
        img.addEventListener('error', function() {
            this.style.display = 'none';
            const parent = this.closest('.slide');
            if (parent) {
                const title = parent.querySelector('.slide-title');
                if (title) {
                    title.textContent = title.textContent + ' (Image unavailable)';
                    title.style.opacity = '1';
                }
            }
        });
    });
})();
</script>
